name: Build Wheels
run-name: Build wheels for ${{ inputs.release_tag || github.ref_name }} by @${{ github.actor }}

on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - main
      - v0.*
      - v1.*
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild and publish (for example v0.1.2)
        required: true
        type: string
      replace_existing:
        description: Replace assets with matching names (default preserves existing assets)
        default: false
        type: boolean
      draft:
        description: Create new releases as drafts (does not change existing releases)
        default: false
        type: boolean
  
permissions:
  contents: read

jobs:
  source:
    name: Resolve build source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Validate manual tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" == v* ]] && git check-ref-format "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - name: Record build source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          Path("release-source.json").write_text(json.dumps({
              "sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "tag": os.environ["RELEASE_TAG"],
          }))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: release-source.json
          if-no-files-found: error

  build_wheels:
    needs: source
    name: Wheels (${{ matrix.variant }}) for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows/macOS PyPI torch is CPU-only, so only Linux needs a CUDA variant.
        include:
          - {os: ubuntu-latest, variant: cpu}
          - {os: ubuntu-latest, variant: cuda}
          - {os: windows-latest, variant: cpu}
          - {os: macos-14, variant: cpu}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select package variant
        run: python scripts/set_variant.py ${{ matrix.variant }}

      - name: Download model weights from release v0.1.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p src/pyfacewipe/models
          gh release download v0.1.1 \
            -R "${GITHUB_REPOSITORY}" \
            -p "synthstrip.1.pt" \
            -p "synthstrip.nocsf.1.pt" \
            -D src/pyfacewipe/models \
            --skip-existing
          ls -lah src/pyfacewipe/models

      - name: Build the modern wheels
        uses: pypa/cibuildwheel@v2.23.4
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "pp* *-musllinux_* *-win32"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: yum install -y libjpeg-turbo-devel openblas-devel lapack-devel
          CIBW_ENVIRONMENT_LINUX: PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu
          CIBW_TEST_REQUIRES: pytest ${{ matrix.variant == 'cpu' && 'torch' || '' }}
          CIBW_TEST_COMMAND: 'pytest {project}/test -m "not slow"'

      - name: Verify wheels contain model weights
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import glob
          import sys
          import zipfile

          whls = glob.glob("wheelhouse/*.whl")
          if not whls:
              print("No wheels found in wheelhouse/*.whl", file=sys.stderr)
              sys.exit(1)

          required = {
              "pyfacewipe/models/synthstrip.1.pt",
              "pyfacewipe/models/synthstrip.nocsf.1.pt",
          }

          missing_any = False
          for whl in whls:
              with zipfile.ZipFile(whl) as z:
                  names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  missing_any = True
                  print(f"ERROR: {whl} is missing: {missing}", file=sys.stderr)
              else:
                  print(f"OK: {whl} contains model weights")

          sys.exit(1 if missing_any else 0)
          PY

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.variant }}-${{ runner.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    needs: source
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish_release:
    needs: [source, build_wheels, build_sdist]
    if: needs.source.outputs.tag != ''
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      release_tag: ${{ needs.source.outputs.tag }}
      build_run_id: ${{ github.run_id }}
      source_sha: ${{ needs.source.outputs.sha }}
      replace_existing: ${{ inputs.replace_existing || false }}
      draft: ${{ inputs.draft || false }}
