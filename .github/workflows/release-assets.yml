name: Release Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (for example v0.1.2)
        required: true
        type: string
      build_run_id:
        description: Successful Build Wheels run ID whose artifacts should be uploaded
        required: true
        type: string
      replace_existing:
        description: Replace assets with matching names (default uploads only missing assets)
        default: false
        type: boolean
      draft:
        description: Create new releases as drafts (does not change existing releases)
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      build_run_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      replace_existing:
        default: false
        type: boolean
      draft:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-assets-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify build and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
          DRAFT: ${{ inputs.draft }}
        run: python scripts/publish_release.py
